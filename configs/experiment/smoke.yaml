# 5-minute sanity run: 2 tiny environments, 1 seed, CPU-friendly.
name: smoke
streams:
  - configs/stream/smoke_stream.yaml
model: configs/model/base.yaml
methods: [finetune, joint, ewc, si, replay, agem, lwf, bilevel, titans]
seeds: [0]
