# The main benchmark: every method on every measured stream, five seeds.
#
# traffic-shift is absent: it sources TRACTOR, which Day 1 moved off the critical path.
# The five streams here are the ones with prepared data, and four of them have been
# measured already -- two forget, two do not, and both nulls are reported.
name: main
streams:
  - configs/stream/cross_dataset.yaml   # forgets most: PRB budget changes across testbeds
  - configs/stream/slice_shift.yaml     # forgets: RBG allocation changes
  - configs/stream/radio_shift.yaml     # null: distance and mobility
  - configs/stream/sched_shift.yaml     # null: scheduling discipline
  - configs/stream/cyclic.yaml          # environments recur; measures retention directly
model: configs/model/base.yaml
methods: [finetune, joint, ewc, si, replay, agem, lwf, bilevel, titans, nestedric]
seeds: [0, 1, 2, 3, 4]
processed_dir: data/processed
device: auto
stride: 8
n_source_envs: 1
statistics:
  unit_of_analysis: fold     # (stream, seed); never the sample
  bootstrap: 10000
  correction: holm-bonferroni
output_dir: results/runs/main
