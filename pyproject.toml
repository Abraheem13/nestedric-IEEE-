[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nestedric"
version = "0.1.0.dev0"
description = "Multi-timescale Nested Learning for forgetting-robust O-RAN RIC control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Abraheem Rashid", email = "2546393@brunel.ac.uk" },
]
keywords = ["O-RAN", "continual learning", "nested learning", "6G", "RIC", "mobile computing"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.4", "black>=24.3", "mypy>=1.9", "pre-commit"]
sim = ["ns3-gym; sys_platform == 'linux'"]

[project.scripts]
nestedric = "nestedric.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213"]

# D102/D105/D107: methods implement the documented `Method` protocol in
# methods/base.py; repeating its docstrings per method adds noise, not information.
# D401: several docstrings describe a returned quantity ("Steps to recover ...") where
# imperative mood reads worse than the noun phrase.
extend-ignore = [
  "D102", "D105", "D107", "D401",
  # R is the T x T evaluation matrix and T the stream horizon -- the notation of the
  # continual-learning literature this implements. F, C, M are conventional module
  # aliases. Renaming them would make the code disagree with the papers it follows.
  "N806", "N812",
  # D400 demands a full stop where D415 already accepts "?" -- several docstrings here
  # open with a question, which is the clearest summary of what the script answers.
  "D400",
  # Our exceptions read as conditions (Divergence, RunInProgress, TraceIdCollision)
  # rather than as errors, which is how they are raised and caught.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
# Test names are the documentation; requiring docstrings on every test adds noise
# without adding information. N812 covers the conventional `as C` module alias.
"tests/*" = ["D100", "D101", "D102", "D103", "D401", "N812"]
"scripts/*" = ["D103", "N812"]
# R is the conventional symbol for the T x T continual-learning evaluation matrix.
"src/nestedric/eval/metrics.py" = ["N803"]
"src/nestedric/theory/bound.py" = ["N803"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
